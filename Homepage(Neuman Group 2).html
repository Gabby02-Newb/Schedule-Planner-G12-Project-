<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Schedule Planner</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://static.vecteezy.com/system/resources/previews/010/008/086/non_2x/background-dimension-3d-graphic-message-board-for-text-and-message-design-line-shadow-for-modern-w[...]
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      color: white;
      text-align: center;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 50px;
      border-radius: 10px;
      width: 60%;
      position: relative;
    }

    h1 {
      font-family: Algerian, serif;
      color: white;
      margin-bottom: 20px;
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .nav-button {
      background-color: orange;
      color: white;
      border: none;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .nav-button:hover {
      background-color: orange;
    }

    .nav-button i {
      margin-right: 10px;
    }

    .nav-button p {
      margin: 0;
      font-size: 16px;
    }

    /* Logout button in upper-right corner */
    #logoutBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #logoutBtn:hover {
      background-color: #ff4c4c;
    }

    /* make sure the logout button is visible even on small screens */
    @media (max-width: 700px) {
      .container { width: 90%; padding: 30px; }
      #logoutBtn { top: 8px; right: 8px; padding: 8px 10px; font-size: 13px; }
      .button-container { grid-template-columns: repeat(1, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logout placed here so it's anchored to the top-right of the container (visible on page) -->
    <button id="logoutBtn" title="Log out">
      <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
      <span>Log out</span>
    </button>

    <h1>Welcome to Your Schedule Planner</h1>
    <div class="button-container">

      <!-- Button to Guide -->
      <button class="nav-button" onclick="window.location.href='Guide(Neuman Group 2).html'">
        <i class="fas fa-book-open"></i>
        <p>Guide</p>
      </button>

      <!-- Button to Schedule Planner -->
      <button class="nav-button" onclick="window.location.href='Interface(Numan Group 2).html'">
        <i class="fas fa-calendar-alt"></i>
        <p>Schedule Planner</p>
      </button>

      <!-- Button to Information -->
      <button class="nav-button" onclick="window.location.href='Info(Neuman Group 2).html'">
        <i class="fas fa-info-circle"></i>
        <p>Information</p>
      </button>

    </div>
  </div>

  <script>
    // Use the same key used by the login/planner pages
    const LOGGED_USER_KEY = 'loggedInUser_v1';

    // When logout clicked: remove the logged-in marker and redirect to the login page.
    // If planner is open in another tab/window it will detect the removed key on next activity.
    document.getElementById('logoutBtn').addEventListener('click', () => {
      // Remove logged-in flag
      try { localStorage.removeItem(LOGGED_USER_KEY); } catch (e) { console.error(e); }

      // Optional: try to notify planner in another window (if opened via window.opener).
      // This is a best-effort; if planner is open in a different tab it will still need to read localStorage.
      try {
        // If this page opened the planner in a new window and still has a reference:
        if (window.opener && typeof window.opener.onUserLogout === 'function') {
          try { window.opener.onUserLogout(); } catch (err) { /* ignore cross-origin errors */ }
        }
      } catch (err) {
        // ignore
      }

      // Redirect to login page
      window.location.href = 'Login(Neuman Group 2).html';
    });
  </script>
</body>
</html>
