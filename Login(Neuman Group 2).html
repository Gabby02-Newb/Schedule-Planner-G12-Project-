<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Signup Page</title>
  <style>
    /* Page background */
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Container */
    .auth-container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 360px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 10px;
      margin: 6px 0 14px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    /* Ensure space for the toggle icon inside the input wrapper */
    .password-wrapper input {
      padding-right: 40px;
    }

    /* Eye toggle button */
    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    .toggle-password:focus {
      outline: 2px solid #85b7ff;
      outline-offset: 2px;
    }
    .password-wrapper {
      position: relative;
    }

    input[type="submit"], .toggle-btn, .debug-btn {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 6px;
    }

    input[type="submit"]:hover, .toggle-btn:hover, .debug-btn:hover {
      background-color: #45a049;
    }

    .small {
      text-align: center;
      font-size: 0.9em;
      color: #666;
      margin-top: 10px;
    }

    .link {
      color: #007bff;
      cursor: pointer;
      text-decoration: underline;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 0.95em;
    }

    /* Hidden by default - used to switch between forms */
    .hidden {
      display: none;
    }

    .field-error {
      color: #b00020;
      font-size: 0.9em;
      margin-top: -10px;
      margin-bottom: 10px;
    }

    /* Saved accounts debug list */
    #savedAccounts {
      margin-top: 12px;
      padding: 8px;
      border: 1px dashed #ccc;
      border-radius: 6px;
      font-size: 0.9em;
      color: #333;
      background: #fafafa;
    }

    .muted {
      color: #666;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div id="loginPanel">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" placeholder="Enter your username" required>

        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-password" id="toggleLoginPassword" aria-pressed="false" aria-label="Show password">
            <!-- initial eye icon (closed style indicates hidden) -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <input type="submit" value="Login">
      </form>
      <p id="loginMessage" class="small" aria-live="polite"></p>
      <p class="small">Don't have an account? <span id="showSignup" class="link">Sign up</span></p>
    </div>

    <div id="signupPanel" class="hidden">
      <h2>Sign up</h2>
      <form id="signupForm">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" name="username" placeholder="Pick a username" required>

        <label for="signupPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupPassword" name="password" placeholder="Choose a password (min 6 chars)" required>
          <button type="button" class="toggle-password" id="toggleSignupPassword" aria-pressed="false" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <label for="signupConfirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
          <button type="button" class="toggle-password" id="toggleSignupConfirmPassword" aria-pressed="false" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div id="signupError" class="field-error" aria-live="polite"></div>

        <input type="submit" value="Create account">
      </form>
      <p id="signupMessage" class="small" aria-live="polite"></p>
      <p class="small">Already have an account? <span id="showLogin" class="link">Login</span></p>
    </div>

    <button id="toggleSavedBtn" class="debug-btn">Show saved accounts </button>
    <div id="savedAccounts" class="hidden" aria-live="polite"></div>

    <div id="message" aria-live="polite"></div>
  </div>

  <script>
    // Storage key used by the planner for logged-in user
    const LOGGED_USER_KEY = 'loggedInUser_v1';

    // Utility: hash a password using SHA-256 and return hex string
    async function hashPassword(password) {
      const enc = new TextEncoder();
      const data = enc.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Users are stored in localStorage under key 'users' as JSON object: { username: passwordHash, ... }
    function getStoredUsers() {
      try {
        const raw = localStorage.getItem('users');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.error('Failed to parse stored users', e);
        return {};
      }
    }

    function saveStoredUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    // UI elements
    const loginPanel = document.getElementById('loginPanel');
    const signupPanel = document.getElementById('signupPanel');
    const showSignup = document.getElementById('showSignup');
    const showLogin = document.getElementById('showLogin');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginMessage = document.getElementById('loginMessage');
    const signupMessage = document.getElementById('signupMessage');
    const signupError = document.getElementById('signupError');
    const savedAccountsDiv = document.getElementById('savedAccounts');
    const toggleSavedBtn = document.getElementById('toggleSavedBtn');

    // Toggle panels
    showSignup.addEventListener('click', () => {
      loginPanel.classList.add('hidden');
      signupPanel.classList.remove('hidden');
      loginMessage.textContent = '';
      signupMessage.textContent = '';
      signupError.textContent = '';
      signupForm.reset();
    });

    showLogin.addEventListener('click', () => {
      signupPanel.classList.add('hidden');
      loginPanel.classList.remove('hidden');
      loginForm.reset();
      signupMessage.textContent = '';
      loginMessage.textContent = '';
      signupError.textContent = '';
    });

    // Toggle saved accounts debug display
    toggleSavedBtn.addEventListener('click', () => {
      if (savedAccountsDiv.classList.contains('hidden')) {
        updateSavedAccountsDisplay();
        savedAccountsDiv.classList.remove('hidden');
        toggleSavedBtn.textContent = 'Hide saved accounts ';
      } else {
        savedAccountsDiv.classList.add('hidden');
        toggleSavedBtn.textContent = 'Show saved accounts ';
      }
    });

    function updateSavedAccountsDisplay() {
      const users = getStoredUsers();
      const keys = Object.keys(users);
      if (keys.length === 0) {
        savedAccountsDiv.innerHTML = '<div class="muted">No saved accounts found in localStorage.</div>';
        return;
      }
      // Show usernames only for quick verification (do not expose hashed passwords here)
      savedAccountsDiv.innerHTML = '<strong>Saved usernames:</strong><br>' + keys.map(u => '- ' + escapeHtml(u)).join('<br>');
    }

    // Simple escape for displayed usernames
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Signup handler
    signupForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      signupError.textContent = '';
      signupMessage.textContent = '';

      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirmPassword').value;

      if (!username) {
        signupError.textContent = 'Username cannot be empty.';
        return;
      }
      if (password.length < 6) {
        signupError.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (password !== confirm) {
        signupError.textContent = 'Passwords do not match. Please re-enter.';
        return;
      }

      const users = getStoredUsers();
      if (users.hasOwnProperty(username)) {
        signupError.textContent = 'Username already taken. Please choose another.';
        return;
      }

      try {
        const hashed = await hashPassword(password);
        users[username] = hashed;
        saveStoredUsers(users);

        // Verification: re-read and ensure saved
        const recheck = getStoredUsers();
        if (recheck[username] && recheck[username] === hashed) {
          signupMessage.style.color = 'green';
          signupMessage.textContent = 'Account created successfully. You may now log in.';
          console.info('Signup saved successfully for user:', username);
          updateSavedAccountsDisplay();
          // Switch back to login after a short delay
          setTimeout(() => {
            signupPanel.classList.add('hidden');
            loginPanel.classList.remove('hidden');
            signupForm.reset();
            signupMessage.textContent = '';
          }, 900);
        } else {
          // Something went wrong saving
          signupMessage.style.color = 'red';
          signupMessage.textContent = 'An error occurred saving the account. Please try again.';
          console.error('Re-check failed after saving user:', username, 'stored object:', recheck);
        }
      } catch (err) {
        console.error(err);
        signupMessage.style.color = 'red';
        signupMessage.textContent = 'An error occurred creating the account.';
      }
    });

    // Helper: request notification permission (used to prompt user at login time)
    async function requestNotificationPermissionAtLogin() {
      if (!('Notification' in window)) return false;
      try {
        if (Notification.permission === 'granted') return true;
        if (Notification.permission === 'denied') return false;
        const result = await Notification.requestPermission();
        return result === 'granted';
      } catch (e) {
        console.error('Notification permission request failed', e);
        return false;
      }
    }

    // Login handler
    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      loginMessage.textContent = '';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      const users = getStoredUsers();
      if (!users.hasOwnProperty(username)) {
        loginMessage.style.color = 'red';
        loginMessage.textContent = 'Incorrect username or password.';
        return;
      }

      try {
        const hashed = await hashPassword(password);
        if (users[username] === hashed) {
          // Mark user as logged in for planner notifications and other pages
          localStorage.setItem(LOGGED_USER_KEY, username);

          // Optionally request notification permission now so the planner can start immediately after redirect.
          requestNotificationPermissionAtLogin().then((granted) => {
            // If you want to track permission, you can store a flag; planner checks Notification.permission directly.
            if (granted) {
              console.info('Notifications granted at login for', username);
            }
            // Show success message then redirect
            loginMessage.style.color = 'green';
            loginMessage.textContent = 'Login successful! Redirecting...';
            setTimeout(() => {
              // Redirect to homepage / planner
              window.location.href = "Homepage(Neuman Group 2).html";
            }, 700);
          });
        } else {
          loginMessage.style.color = 'red';
          loginMessage.textContent = 'Incorrect username or password.';
        }
      } catch (err) {
        console.error(err);
        loginMessage.style.color = 'red';
        loginMessage.textContent = 'An error occurred during login.';
      }
    });

    // Password show/hide toggle logic
    (function setupPasswordToggles() {
      const eyeOpenSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      const eyeClosedSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-5 0-9.27-3.11-11-7 .7-1.57 1.86-3 3.27-4.2" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1 1l22 22" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.53 9.53A3 3 0 0 0 14.47 14.47" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

      function wireToggle(buttonId, inputId) {
        const btn = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (!btn || !input) return;

        // Initialize icon state: input.type === 'password' => show eyeOpenSVG (meaning "show")
        btn.innerHTML = eyeOpenSVG;
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'Show password');

        btn.addEventListener('click', () => {
          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          btn.innerHTML = isHidden ? eyeClosedSVG : eyeOpenSVG;
          btn.setAttribute('aria-pressed', String(isHidden));
          btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');

          // Keep focus on the input after toggling so keyboard users keep context
          input.focus();
        });

        // Allow toggling with Enter/Space for keyboard users
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            btn.click();
          }
        });
      }

      // Wire the three password fields we have
      wireToggle('toggleLoginPassword', 'loginPassword');
      wireToggle('toggleSignupPassword', 'signupPassword');
      wireToggle('toggleSignupConfirmPassword', 'signupConfirmPassword');
    })();

    // (Optional) On load, update saved accounts display (hidden by default)
    document.addEventListener('DOMContentLoaded', () => {
      // If you want the saved accounts visible immediately for testing, remove the .hidden toggle above
      updateSavedAccountsDisplay();
    });
  </script>
</body>
</html>
