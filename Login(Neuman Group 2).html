<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .auth-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 360px;
    }

    h2 { text-align: center; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 4px;
    }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; cursor: pointer; color: #666;
      width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    }
    .toggle-password:focus { outline: 2px solid #85b7ff; outline-offset: 2px; }
    input[type="submit"], .toggle-btn, .debug-btn {
      width: 100%; background-color: #4CAF50; color: white; padding: 10px;
      border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 6px;
    }
    input[type="submit"]:hover, .toggle-btn:hover, .debug-btn:hover { background-color: #45a049; }
    .small { text-align: center; font-size: 0.9em; color: #666; margin-top: 10px; }
    .link { color: #007bff; cursor: pointer; text-decoration: underline; }
    #message { text-align: center; margin-top: 10px; font-size: 0.95em; }
    .hidden { display: none; }
    .field-error { color: #b00020; font-size: 0.9em; margin: -10px 0 10px; }
    .muted { color: #666; font-size: 0.85em; }
  </style>
</head>
<body>

<div class="auth-container">
  <div id="loginPanel">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="loginUsername">Username</label>
      <input type="text" id="loginUsername" name="username" placeholder="Enter your username" required>

      <label for="loginPassword">Password</label>
      <div class="password-wrapper">
        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
        <button type="button" class="toggle-password" id="toggleLoginPassword" aria-pressed="false" aria-label="Show password"></button>
      </div>

      <input type="submit" value="Login">
    </form>
    <p id="loginMessage" class="small" aria-live="polite"></p>
    <p class="small">Don't have an account? <span id="showSignup" class="link">Sign up</span></p>
  </div>

  <div id="signupPanel" class="hidden">
    <h2>Sign up</h2>
    <form id="signupForm">
      <label for="signupUsername">Username</label>
      <input type="text" id="signupUsername" name="username" placeholder="Pick a username" required>

      <label for="signupPassword">Password</label>
      <div class="password-wrapper">
        <input type="password" id="signupPassword" name="password" placeholder="Choose a password (min 6 chars)" required>
        <button type="button" class="toggle-password" id="toggleSignupPassword" aria-pressed="false" aria-label="Show password"></button>
      </div>

      <label for="signupConfirmPassword">Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
        <button type="button" class="toggle-password" id="toggleSignupConfirmPassword" aria-pressed="false" aria-label="Show password"></button>
      </div>

      <div id="signupError" class="field-error" aria-live="polite"></div>
      <input type="submit" value="Create account">
    </form>
    <p id="signupMessage" class="small" aria-live="polite"></p>
    <p class="small">Already have an account? <span id="showLogin" class="link">Login</span></p>
  </div>

  <div id="message" aria-live="polite"></div>
</div>

<script>
const LOGGED_USER_KEY = 'loggedInUser_v1';

async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function getStoredUsers() {
  try { return JSON.parse(localStorage.getItem('users') || '{}'); } 
  catch { return {}; }
}
function saveStoredUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }

const loginPanel = document.getElementById('loginPanel');
const signupPanel = document.getElementById('signupPanel');
const showSignup = document.getElementById('showSignup');
const showLogin = document.getElementById('showLogin');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');
const loginMessage = document.getElementById('loginMessage');
const signupMessage = document.getElementById('signupMessage');
const signupError = document.getElementById('signupError');

showSignup.addEventListener('click', () => {
  loginPanel.classList.add('hidden');
  signupPanel.classList.remove('hidden');
  signupError.textContent = signupMessage.textContent = loginMessage.textContent = '';
  signupForm.reset();
});

showLogin.addEventListener('click', () => {
  signupPanel.classList.add('hidden');
  loginPanel.classList.remove('hidden');
  loginForm.reset();
  signupMessage.textContent = loginMessage.textContent = signupError.textContent = '';
});

signupForm.addEventListener('submit', async e => {
  e.preventDefault();
  signupError.textContent = signupMessage.textContent = '';
  const username = signupForm.username.value.trim();
  const password = signupForm.password.value;
  const confirm = signupForm.confirmPassword.value;
  if (!username) return signupError.textContent = 'Username cannot be empty.';
  if (password.length < 6) return signupError.textContent = 'Password must be at least 6 characters.';
  if (password !== confirm) return signupError.textContent = 'Passwords do not match.';

  const users = getStoredUsers();
  if (users[username]) return signupError.textContent = 'Username already taken.';

  try {
    const hashed = await hashPassword(password);
    users[username] = hashed;
    saveStoredUsers(users);
    signupMessage.style.color = 'green';
    signupMessage.textContent = 'Account created! Redirecting to login...';
    setTimeout(() => {
      signupPanel.classList.add('hidden');
      loginPanel.classList.remove('hidden');
      signupForm.reset();
      signupMessage.textContent = '';
    }, 900);
  } catch {
    signupMessage.style.color = 'red';
    signupMessage.textContent = 'Error creating account.';
  }
});

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  loginMessage.textContent = '';
  const username = loginForm.username.value.trim();
  const password = loginForm.password.value;
  const users = getStoredUsers();
  if (!users[username]) return loginMessage.style.color='red', loginMessage.textContent='Incorrect username or password.';
  const hashed = await hashPassword(password);
  if (users[username] === hashed) {
    localStorage.setItem(LOGGED_USER_KEY, username);
    loginMessage.style.color = 'green';
    loginMessage.textContent = 'Login successful! Redirecting...';
    setTimeout(() => window.location.href = "Homepage(Neuman Group 2).html", 700);
  } else {
    loginMessage.style.color = 'red';
    loginMessage.textContent = 'Incorrect username or password.';
  }
});

// Password toggle
(function(){
  const eyeOpen = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const eyeClosed = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-5 0-9.27-3.11-11-7 .7-1.57 1.86-3 3.27-4.2" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.53 9.53A3 3 0 0 0 14.47 14.47" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function toggle(btnId, inputId){
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    if (!btn || !input) return;
    btn.innerHTML = eyeOpen;
    btn.addEventListener('click', () => {
      const hidden = input.type==='password';
      input.type = hidden ? 'text':'password';
      btn.innerHTML = hidden ? eyeClosed:eyeOpen;
      input.focus();
    });
  }
  toggle('toggleLoginPassword','loginPassword');
  toggle('toggleSignupPassword','signupPassword');
  toggle('toggleSignupConfirmPassword','signupConfirmPassword');
})();
</script>
</body>
</html>
