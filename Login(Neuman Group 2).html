<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Schedule Planner</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
    body { display: flex; justify-content: stretch; align-items: stretch; min-height: 100vh; }

    .left-side { flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 60px 40px; position: relative; overflow: hidden; }
    .left-content { position: relative; z-index: 2; text-align: center; max-width: 400px; }
    .brand-logo { font-size: 72px; margin-bottom: 25px; display: inline-block; background: rgba(255,255,255,0.2); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); }

    .right-side { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; background: #f5f7fa; }
    .login-container { background: white; padding: 50px 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }

    .login-header { text-align: center; margin-bottom: 35px; }
    .login-container h2 { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 8px; }

    .form-group { margin-bottom: 22px; }

    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
    }

    input[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
    }

    #message { margin-top: 15px; padding: 12px 14px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14px; display: none; }

    .success-message { background: rgba(46,204,113,0.1); color: #27ae60; border-left: 3px solid #27ae60; }
    .error-message { background: rgba(231,76,60,0.1); color: #e74c3c; border-left: 3px solid #e74c3c; }
  </style>
</head>
<body>

<div class="right-side">
  <div class="login-container">

    <div class="login-header">
      <h2>Login</h2>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>

      <input type="submit" value="Login">
    </form>

    <p id="message"></p>

  </div>
</div>

<script>

const LOGGED_USER_KEY='loggedInUser_v1';
const USERS_KEY='users_v1';

async function hashPassword(password){
  const data=new TextEncoder().encode(password);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getStoredUsers(){
  try { return JSON.parse(localStorage.getItem(USERS_KEY)||'{}'); }
  catch { return {}; }
}

function saveUsers(users){
  localStorage.setItem(USERS_KEY,JSON.stringify(users));
}

/* FIX #2 — Proper form submit handling */
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  await checkLogin();
});

async function checkLogin(){

  const user=document.getElementById('loginUsername').value.trim();
  const pass=document.getElementById('loginPassword').value;
  const users=getStoredUsers();

  if(!users[user]){
    showError('User does not exist');
    return;
  }

  const hashedInput=await hashPassword(pass);

  if(users[user]===hashedInput){
    localStorage.setItem(LOGGED_USER_KEY,user);
    showSuccess('✓ Login successful! Redirecting...');
    setTimeout(()=>window.location.href='Homepage(Neuman Group 2).html',1200);
  } 
  else{
    showError('✗ Incorrect password');
  }
}

function showSuccess(text){
  const msg=document.getElementById('message');
  msg.classList.remove('error-message');
  msg.classList.add('success-message');
  msg.textContent=text;
  msg.style.display='block';
}

function showError(text){
  const msg=document.getElementById('message');
  msg.classList.remove('success-message');
  msg.classList.add('error-message');
  msg.textContent=text;
  msg.style.display='block';
}

</script>
</body>
</html>
